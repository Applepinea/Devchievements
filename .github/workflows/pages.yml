name: Pages

# Publishes docs/privacy.md as a public page. The Microsoft Store requires a
# reachable privacy policy URL, and internal documentation does not count.

on:
  push:
    branches: [main]
    paths:
      - "docs/privacy.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Render the policy as HTML
        run: |
          mkdir -p _site
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('docs/privacy.md').read_text(encoding='utf-8')
          # Minimal renderer: the page is prose, and pulling a Markdown toolchain
          # into a publishing job for one page is not worth the fragility.
          def inline(s):
              s = re.sub(r'\*\*(.+?)\*\*', r'<strong>\1</strong>', s)
              s = re.sub(r'`(.+?)`', r'<code>\1</code>', s)
              s = re.sub(r'\*(.+?)\*', r'<em>\1</em>', s)
              return s
          out, in_code = [], False
          for line in text.splitlines():
              if line.startswith('```'):
                  out.append('</pre>' if in_code else '<pre>')
                  in_code = not in_code
                  continue
              if in_code:
                  out.append(line.replace('&', '&amp;').replace('<', '&lt;'))
                  continue
              if line.startswith('# '):
                  out.append('<h1>' + inline(line[2:]) + '</h1>')
              elif line.startswith('## '):
                  out.append('<h2>' + inline(line[3:]) + '</h2>')
              elif line.strip() == '---':
                  out.append('<hr>')
              elif line.startswith('- '):
                  out.append('<li>' + inline(line[2:]) + '</li>')
              elif line.strip() == '':
                  out.append('')
              else:
                  out.append('<p>' + inline(line) + '</p>')
          html = '\n'.join(out).replace('<li>', '<ul><li>', 1)
          html = re.sub(r'</li>\n<p>', '</li></ul>\n<p>', html)
          page = ('<!doctype html><html lang="en"><head><meta charset="utf-8">'
                  '<meta name="viewport" content="width=device-width,initial-scale=1">'
                  '<title>Privacy Policy - Devchievements</title>'
                  '<style>body{max-width:46rem;margin:3rem auto;padding:0 1.25rem;'
                  'font:16px/1.7 -apple-system,Segoe UI,Roboto,sans-serif;color:#1c2230}'
                  'pre{background:#f4f6fa;padding:1rem;overflow:auto;border-radius:6px}'
                  'code{background:#f4f6fa;padding:.1rem .3rem;border-radius:4px}'
                  'h1,h2{line-height:1.3}</style></head><body>' + html + '</body></html>')
          pathlib.Path('_site/index.html').write_text(page, encoding='utf-8')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
