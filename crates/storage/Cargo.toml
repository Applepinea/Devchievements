[package]
name = "devchievements-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "SQLite/SQLx adapter, migrations, projections. Never contains achievement judgement logic."

[dependencies]
# SQLx only -- AGENTS.md forbids mixing SQLx with rusqlite.
sqlx = { version = "0.8", default-features = false, features = ["runtime-async-std", "sqlite", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
devchievements-core = { path = "../core" }
devchievements-events = { path = "../events" }
devchievements-daily-rank = { path = "../daily-rank" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
