[workspace]
resolver = "2"
# The Tauri desktop app is built with the MSVC toolchain into its own target dir.
# Mixing MSVC and GNU in one target directory is not possible, and the rest of the
# workspace builds with GNU on this host, so the app is a separate cargo project.
exclude = ["apps/desktop/src-tauri"]
members = [
    "crates/core",
    "crates/events",
    "crates/achievements",
    "crates/daily-rank",
    "crates/notifications",
    "crates/privacy",
    "crates/sound",
    "crates/assets",
    "crates/filters",
    "crates/themes",
    "crates/config",
    "crates/platform",
    "crates/storage",
    "crates/git-hooks",
    "crates/golden-tests",
    "crates/companion-core",
    "crates/property-tests",
    "apps/companion-headless",
    "apps/helper",
    "apps/native-host",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.100"
license = "GPL-3.0-or-later"
authors = ["Devchievements contributors"]


[workspace.dependencies]
# Shared pins. Only list crates that a workspace member actually consumes via
# `workspace = true`; otherwise cargo warns about an unused workspace dependency.
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.lints.cargo]
# Scaffold crates legitimately declare dependencies before use in later phases,
# but we want the warning while the code is empty so nothing rots silently.
unused_dependencies = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
