[package]
name = "devchievements-companion-headless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Headless Companion: runs the real data loop without a window. Used for end-to-end and crash-recovery testing."

[[bin]]
name = "devch-companion"
path = "src/main.rs"

[dependencies]
devchievements-companion-core = { path = "../../crates/companion-core" }
devchievements-storage = { path = "../../crates/storage" }
devchievements-events = { path = "../../crates/events" }
devchievements-git-hooks = { path = "../../crates/git-hooks" }
devchievements-notifications = { path = "../../crates/notifications" }
serde_json = "1"
async-std = { version = "1", features = ["attributes"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-async-std", "sqlite", "migrate"] }

[lints]
workspace = true
